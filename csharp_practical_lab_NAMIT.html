<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# Practical Lab — BCA</title>
<style>
:root{--bg:gray;--card:#fff;--text:#182230;--muted:#667085;--accent:light blue;--border:#e2e7f0;--code:#101827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:linear-gradient(120deg,#182b68,#3157d5);color:#fff;padding:30px 20px}
.wrap{max-width:1120px;margin:auto}h1{margin:0 0 8px;font-size:clamp(25px,4vw,36px)}header p{margin:0;color:#e0e7ff}
main{max-width:1120px;margin:22px auto;padding:0 16px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:16px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--border);padding:11px 13px;background:#fff;color:var(--text)}
input{width:100%}button{cursor:pointer;font-weight:600}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#fff}.tab.active{background:#e8edff;border-color:#9aabff;color:#1737a3}
.stats{color:var(--muted);font-size:14px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:10px 0;overflow:hidden}
.qhead{display:flex;gap:12px;align-items:flex-start;padding:15px;cursor:pointer}.num{background:#edf1ff;color:#2848b8;border-radius:8px;min-width:34px;text-align:center;padding:5px;font-weight:700}
.qtitle{flex:1;font-weight:650}.chev{color:var(--muted)}.answer{padding:0 16px 18px 61px;border-top:1px solid #eef1f6}.answer p{margin:13px 0}.answer pre{white-space:pre-wrap;overflow:auto;background:var(--code);color:#e7eefc;padding:14px;border-radius:10px;font-size:13px;line-height:1.5}.tag{display:inline-block;background:#eef2f7;color:#475467;padding:3px 8px;border-radius:20px;font-size:12px;margin:0 0 8px}
.empty{background:#fff;padding:25px;border-radius:12px;color:var(--muted);text-align:center}
footer{text-align:center;padding:30px 15px;color:var(--muted);font-size:13px}
@media(max-width:650px){.toolbar{grid-template-columns:1fr}.answer{padding-left:15px}.qhead{padding:12px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>C# Practical Lab</h1><p>BCA · C# with .NET Framework · Unit-wise practical questions and solutions</p></div></header>
<main>
<div class="toolbar"><input id="search" placeholder="Search questions, e.g. factorial, DataReader, Session..." aria-label="Search questions"><select id="sort"><option value="unit">Unit order</option><option value="az">Question A–Z</option></select></div>
<div class="tabs" id="tabs"></div>
<div class="stats" id="stats"></div>
<div id="list"></div>
</main>
<footer>Study helper for BCA practical preparation. Adapt database names, connection strings and project templates to your college lab.</footer>
<script>
const questions = [
{u:1,q:"Windows Forms: Hello World button",a:"Add a Button to a Windows Form and double-click it to create the Click event.",c:`private void button1_Click(object sender, EventArgs e)\n{\n    MessageBox.Show("Hello World");\n}`},
{u:1,q:"Student registration form using common controls",a:"Add TextBoxes for name and roll number, a ComboBox for course, RadioButtons for gender, CheckBoxes for hobbies and a Submit button.",c:`private void btnSubmit_Click(object sender, EventArgs e)\n{\n    string gender = radioMale.Checked ? "Male" : "Female";\n    MessageBox.Show($"Name: {txtName.Text}\\nRoll No: {txtRoll.Text}\\nGender: {gender}");\n}`},
{u:1,q:"Simple calculator interface",a:"Place two TextBoxes, an operation ComboBox and a Calculate button. Convert input to numbers and select the operation.",c:`double x = double.Parse(txtA.Text);\ndouble y = double.Parse(txtB.Text);\ndouble result = 0;\nswitch (cmbOperation.Text)\n{\n    case "+": result = x + y; break;\n    case "-": result = x - y; break;\n    case "*": result = x * y; break;\n    case "/":\n        if (y == 0) { MessageBox.Show("Cannot divide by zero"); return; }\n        result = x / y; break;\n    default: MessageBox.Show("Choose an operation"); return;\n}\nlblResult.Text = result.ToString();`},
{u:1,q:"Display current date and time",a:"Use a Label and a Button; the button displays the current system date and time.",c:`private void btnShow_Click(object sender, EventArgs e)\n{\n    lblDateTime.Text = DateTime.Now.ToString("dd-MM-yyyy HH:mm:ss");\n}`},
{u:1,q:"Digital clock using Timer",a:"Set a Timer's Interval to 1000 milliseconds and enable it. Update the label on every Tick.",c:`private void Form1_Load(object sender, EventArgs e)\n{\n    timer1.Interval = 1000;\n    timer1.Start();\n}\nprivate void timer1_Tick(object sender, EventArgs e)\n{\n    lblClock.Text = DateTime.Now.ToString("hh:mm:ss tt");\n}`},
{u:1,q:"ProgressBar increases on button click",a:"Set the ProgressBar Minimum to 0 and Maximum to 100.",c:`private void btnProgress_Click(object sender, EventArgs e)\n{\n    if (progressBar1.Value <= progressBar1.Maximum - 10)\n        progressBar1.Value += 10;\n    else\n        progressBar1.Value = progressBar1.Maximum;\n}`},
{u:1,q:"Display an image with PictureBox",a:"Add a PictureBox, set SizeMode to Zoom, then select an image in its Image property or load one at runtime.",c:`private void btnLoad_Click(object sender, EventArgs e)\n{\n    using (OpenFileDialog dlg = new OpenFileDialog())\n    {\n        dlg.Filter = "Image files|*.jpg;*.jpeg;*.png;*.bmp";\n        if (dlg.ShowDialog() == DialogResult.OK)\n            pictureBox1.Image = Image.FromFile(dlg.FileName);\n    }\n}`},
{u:1,q:"Select and display items using ListBox and ComboBox",a:"Add items in the designer or populate them at runtime.",c:`private void Form1_Load(object sender, EventArgs e)\n{\n    listBox1.Items.AddRange(new object[] { "C#", "Java", "Python" });\n    comboBox1.Items.AddRange(new object[] { "BCA", "BSc", "MCA" });\n}\nprivate void btnShow_Click(object sender, EventArgs e)\n{\n    string item = listBox1.SelectedItem?.ToString() ?? "No list item selected";\n    MessageBox.Show(item + " / " + comboBox1.Text);\n}`},
{u:1,q:"GroupBox and RadioButtons for gender selection",a:"Place RadioButtons inside a GroupBox so the choices are mutually exclusive.",c:`string gender = radioMale.Checked ? "Male" : radioFemale.Checked ? "Female" : "Not selected";\nMessageBox.Show("Gender: " + gender);`},
{u:1,q:"Select multiple hobbies with CheckBoxes",a:"Each CheckBox can be selected independently. Join the checked labels for display.",c:`var hobbies = new List<string>();\nif (chkReading.Checked) hobbies.Add("Reading");\nif (chkMusic.Checked) hobbies.Add("Music");\nif (chkSports.Checked) hobbies.Add("Sports");\nMessageBox.Show(hobbies.Count == 0 ? "No hobbies selected" : string.Join(", ", hobbies));`},
{u:1,q:"Menu-driven Windows Forms application",a:"Add a MenuStrip with File, Edit and Exit menu items. Double-click Exit to create its event.",c:`private void exitToolStripMenuItem_Click(object sender, EventArgs e)\n{\n    this.Close();\n}\nprivate void aboutToolStripMenuItem_Click(object sender, EventArgs e)\n{\n    MessageBox.Show("C# Practical Application");\n}`},
{u:1,q:"Select date of birth with DateTimePicker",a:"Add a DateTimePicker and a button to show the selected date.",c:`private void btnShowDob_Click(object sender, EventArgs e)\n{\n    lblDob.Text = dateTimePicker1.Value.ToString("dd MMMM yyyy");\n}`},
{u:1,q:"Change form background colour on button click",a:"Use the BackColor property of the form.",c:`private void btnColour_Click(object sender, EventArgs e)\n{\n    this.BackColor = Color.LightSkyBlue;\n}`},
{u:1,q:"Name input and welcome MessageBox",a:"Add a TextBox named txtName and a button named btnWelcome.",c:`private void btnWelcome_Click(object sender, EventArgs e)\n{\n    string name = txtName.Text.Trim();\n    if (name == "") MessageBox.Show("Enter your name");\n    else MessageBox.Show("Welcome, " + name + "!");\n}`},
{u:1,q:"Student information form",a:"Create labels and textboxes for name, roll number, course and marks. On Submit, validate required fields and show a summary.",c:`if (txtName.Text.Trim() == "" || txtRoll.Text.Trim() == "")\n{\n    MessageBox.Show("Name and roll number are required");\n    return;\n}\nMessageBox.Show($"Name: {txtName.Text}\\nRoll: {txtRoll.Text}\\nCourse: {cmbCourse.Text}\\nMarks: {txtMarks.Text}");`},

{u:2,q:"Arithmetic operations on two numbers",a:"Read two numbers and perform addition, subtraction, multiplication and division.",c:`Console.Write("Enter two numbers: ");\ndouble a = double.Parse(Console.ReadLine());\ndouble b = double.Parse(Console.ReadLine());\nConsole.WriteLine($"Sum={a+b}, Difference={a-b}, Product={a*b}");\nConsole.WriteLine(b != 0 ? $"Quotient={a/b}" : "Cannot divide by zero");`},
{u:2,q:"Swap two numbers",a:"Use a temporary variable to exchange the values.",c:`int a = 5, b = 10;\nint temp = a;\na = b;\nb = temp;\nConsole.WriteLine($"a={a}, b={b}");`},
{u:2,q:"Largest of three numbers",a:"Compare the three values using if/else.",c:`int a = 12, b = 27, c = 19;\nint largest = a;\nif (b > largest) largest = b;\nif (c > largest) largest = c;\nConsole.WriteLine("Largest = " + largest);`},
{u:2,q:"Check even or odd",a:"A number is even when its remainder after division by 2 is zero.",c:`int n = int.Parse(Console.ReadLine());\nConsole.WriteLine(n % 2 == 0 ? "Even" : "Odd");`},
{u:2,q:"Positive, negative or zero",a:"Compare the number with zero.",c:`int n = int.Parse(Console.ReadLine());\nif (n > 0) Console.WriteLine("Positive");\nelse if (n < 0) Console.WriteLine("Negative");\nelse Console.WriteLine("Zero");`},
{u:2,q:"Check leap year",a:"A leap year is divisible by 400, or divisible by 4 but not by 100.",c:`int year = int.Parse(Console.ReadLine());\nbool leap = year % 400 == 0 || (year % 4 == 0 && year % 100 != 0);\nConsole.WriteLine(leap ? "Leap year" : "Not a leap year");`},
{u:2,q:"Menu-driven calculator using switch",a:"Read the operator and operands; handle division by zero.",c:`double a = double.Parse(Console.ReadLine());\nstring op = Console.ReadLine();\ndouble b = double.Parse(Console.ReadLine());\nswitch (op)\n{\n    case "+": Console.WriteLine(a+b); break;\n    case "-": Console.WriteLine(a-b); break;\n    case "*": Console.WriteLine(a*b); break;\n    case "/": if (b != 0) Console.WriteLine(a/b); else Console.WriteLine("Cannot divide by zero"); break;\n    default: Console.WriteLine("Invalid operator"); break;\n}`},
{u:2,q:"Calculate percentage and grade",a:"For five subjects, percentage is total marks divided by maximum marks, multiplied by 100. Grade thresholds may be adjusted to your college rules.",c:`int total = 0;\nfor (int i = 1; i <= 5; i++) total += int.Parse(Console.ReadLine());\ndouble pct = total / 500.0 * 100;\nstring grade = pct >= 80 ? "A" : pct >= 60 ? "B" : pct >= 40 ? "C" : "Fail";\nConsole.WriteLine($"Percentage={pct:F2}%, Grade={grade}");`},
{u:2,q:"Divisibility by 5 and 11",a:"Check both remainder conditions.",c:`int n = int.Parse(Console.ReadLine());\nConsole.WriteLine(n % 5 == 0 && n % 11 == 0 ? "Divisible by both" : "Not divisible by both");`},
{u:2,q:"Demonstrate operators",a:"This sample demonstrates arithmetic, comparison and logical operators.",c:`int a = 8, b = 3;\nConsole.WriteLine(a+b); Console.WriteLine(a-b); Console.WriteLine(a*b); Console.WriteLine(a/b);\nConsole.WriteLine(a > b); Console.WriteLine(a > 0 && b > 0);`},
{u:2,q:"Print first n natural numbers",a:"Use a for loop from 1 through n.",c:`int n = int.Parse(Console.ReadLine());\nfor (int i = 1; i <= n; i++) Console.Write(i + " ");`},
{u:2,q:"Sum of first n natural numbers",a:"Add the numbers in a loop, or use n(n+1)/2.",c:`int n = int.Parse(Console.ReadLine());\nint sum = 0;\nfor (int i = 1; i <= n; i++) sum += i;\nConsole.WriteLine("Sum = " + sum);`},
{u:2,q:"Factorial of a number",a:"Factorial of n is the product of integers from 1 to n; 0! is 1.",c:`int n = int.Parse(Console.ReadLine());\nlong fact = 1;\nif (n < 0) Console.WriteLine("Factorial is undefined for negative integers");\nelse { for (int i = 2; i <= n; i++) fact *= i; Console.WriteLine(fact); }`},
{u:2,q:"Multiplication table",a:"Multiply the input number by 1 through 10.",c:`int n = int.Parse(Console.ReadLine());\nfor (int i = 1; i <= 10; i++) Console.WriteLine($"{n} x {i} = {n*i}");`},
{u:2,q:"Check prime number",a:"A prime number is greater than 1 and has no divisor other than 1 and itself.",c:`int n = int.Parse(Console.ReadLine());\nbool prime = n >= 2;\nfor (int i = 2; i <= Math.Sqrt(n) && prime; i++)\n    if (n % i == 0) prime = false;\nConsole.WriteLine(prime ? "Prime" : "Not prime");`},
{u:2,q:"Fibonacci series",a:"Each term after the first two is the sum of the previous two terms.",c:`int n = int.Parse(Console.ReadLine());\nint a = 0, b = 1;\nfor (int i = 0; i < n; i++) { Console.Write(a + " "); int next = a + b; a = b; b = next; }`},
{u:2,q:"Reverse digits of a number",a:"Extract the last digit using % 10 and remove it using integer division.",c:`int n = int.Parse(Console.ReadLine());\nint x = Math.Abs(n), rev = 0;\nwhile (x > 0) { rev = rev * 10 + x % 10; x /= 10; }\nConsole.WriteLine(n < 0 ? -rev : rev);`},
{u:2,q:"Check numeric palindrome",a:"Reverse the number and compare it with the original.",c:`int n = int.Parse(Console.ReadLine());\nint original = n, x = Math.Abs(n), rev = 0;\nwhile (x > 0) { rev = rev * 10 + x % 10; x /= 10; }\nConsole.WriteLine(n >= 0 && original == rev ? "Palindrome" : "Not palindrome");`},
{u:2,q:"Armstrong number",a:"For a three-digit number, add the cubes of its digits and compare the sum with the number.",c:`int n = int.Parse(Console.ReadLine());\nint x = n, sum = 0;\nwhile (x > 0) { int d = x % 10; sum += d*d*d; x /= 10; }\nConsole.WriteLine(sum == n ? "Armstrong number (3-digit method)" : "Not Armstrong");`},
{u:2,q:"Print star pattern",a:"Use nested loops: the outer loop controls rows and the inner loop prints stars.",c:`for (int i = 1; i <= 5; i++)\n{\n    for (int j = 1; j <= i; j++) Console.Write("* ");\n    Console.WriteLine();\n}`},
{u:2,q:"Demonstrate break and continue",a:"break exits the loop; continue skips to the next iteration.",c:`for (int i = 1; i <= 10; i++)\n{\n    if (i == 3) continue;\n    if (i == 8) break;\n    Console.Write(i + " ");\n}`},
{u:2,q:"Declare, initialize and display an array",a:"An array stores a fixed-size sequence of elements of the same type.",c:`int[] numbers = { 10, 20, 30, 40 };\nforeach (int n in numbers) Console.WriteLine(n);`},
{u:2,q:"Sum and average of array elements",a:"Add all array values and divide by the number of elements.",c:`int[] a = { 10, 20, 30, 40 };\nint sum = 0;\nforeach (int n in a) sum += n;\nConsole.WriteLine($"Sum={sum}, Average={(double)sum/a.Length}");`},
{u:2,q:"Largest and smallest array elements",a:"Initialize min and max with the first element and compare each value.",c:`int[] a = { 12, 4, 25, 8, 17 };\nint min = a[0], max = a[0];\nforeach (int n in a) { if (n < min) min = n; if (n > max) max = n; }\nConsole.WriteLine($"Min={min}, Max={max}");`},
{u:2,q:"Sort an array ascending",a:"Use Array.Sort for the built-in method; a bubble sort can also be written for practice.",c:`int[] a = { 5, 2, 9, 1, 3 };\nArray.Sort(a);\nConsole.WriteLine(string.Join(", ", a));`},
{u:2,q:"Search an element in an array",a:"Array.IndexOf returns the index or -1 when the value is absent.",c:`int[] a = { 5, 2, 9, 1, 3 };\nint target = int.Parse(Console.ReadLine());\nint index = Array.IndexOf(a, target);\nConsole.WriteLine(index >= 0 ? "Found at index " + index : "Not found");`},
{u:2,q:"Add two matrices",a:"Both matrices must have the same dimensions; add corresponding elements.",c:`int[,] a = { {1,2}, {3,4} };\nint[,] b = { {5,6}, {7,8} };\nfor (int i=0; i<2; i++) { for (int j=0; j<2; j++) Console.Write((a[i,j]+b[i,j])+" "); Console.WriteLine(); }`},
{u:2,q:"Transpose a matrix",a:"Rows become columns and columns become rows.",c:`int[,] a = { {1,2,3}, {4,5,6} };\nfor (int j=0; j<3; j++) { for (int i=0; i<2; i++) Console.Write(a[i,j]+" "); Console.WriteLine(); }`},
{u:2,q:"Find string length",a:"Use the Length property.",c:`string s = Console.ReadLine();\nConsole.WriteLine("Length = " + s.Length);`},
{u:2,q:"Convert string to upper/lower case",a:"Use ToUpper() and ToLower().",c:`string s = Console.ReadLine();\nConsole.WriteLine(s.ToUpper());\nConsole.WriteLine(s.ToLower());`},
{u:2,q:"Reverse a string",a:"Convert the string to a character array, reverse it and create a new string.",c:`string s = Console.ReadLine();\nchar[] chars = s.ToCharArray();\nArray.Reverse(chars);\nConsole.WriteLine(new string(chars));`},
{u:2,q:"Check string palindrome",a:"Compare a string with its reversed version; this simple version is case-sensitive.",c:`string s = Console.ReadLine();\nchar[] chars = s.ToCharArray(); Array.Reverse(chars);\nConsole.WriteLine(s == new string(chars) ? "Palindrome" : "Not palindrome");`},
{u:2,q:"Count vowels and consonants",a:"Check each letter after converting it to lowercase.",c:`string s = Console.ReadLine().ToLower(); int v=0, c=0;\nforeach (char ch in s) if (char.IsLetter(ch)) { if ("aeiou".Contains(ch)) v++; else c++; }\nConsole.WriteLine($"Vowels={v}, Consonants={c}");`},
{u:2,q:"Remove leading and trailing spaces",a:"Trim() removes whitespace from both ends of a string.",c:`string s = Console.ReadLine();\nConsole.WriteLine(s.Trim());`},
{u:2,q:"Demonstrate string methods",a:"C# string methods include Substring, Trim, ToUpper, ToLower and Replace. VB-style Left/Right methods are not built-in C# string methods.",c:`string s = "  Hello CSharp  ";\nConsole.WriteLine(s.Trim());\nConsole.WriteLine(s.ToUpper());\nConsole.WriteLine(s.Substring(2, 5));\nConsole.WriteLine(s.Trim().Replace("CSharp", "C#"));`},
{u:2,q:"Function to calculate factorial",a:"Create a reusable function and call it from Main.",c:`static long Factorial(int n)\n{\n    if (n < 0) throw new ArgumentException("n must be non-negative");\n    long result = 1;\n    for (int i = 2; i <= n; i++) result *= i;\n    return result;\n}\n// Example: Console.WriteLine(Factorial(5));`},
{u:2,q:"Function to find larger of two numbers",a:"Return the larger value from a function.",c:`static int Larger(int a, int b) => a > b ? a : b;\n// Example: Console.WriteLine(Larger(8, 12));`},
{u:2,q:"Windows Forms: add two numbers",a:"Add two TextBoxes and a button. Parse the inputs and show the sum.",c:`private void btnAdd_Click(object sender, EventArgs e)\n{\n    if (double.TryParse(txtA.Text, out double a) && double.TryParse(txtB.Text, out double b))\n        lblResult.Text = (a + b).ToString();\n    else MessageBox.Show("Enter valid numbers");\n}`},
{u:2,q:"Button-click event demonstration",a:"Double-click the button in the Windows Forms designer and write code in its Click handler.",c:`private void button1_Click(object sender, EventArgs e)\n{\n    label1.Text = "Button clicked!";\n}`},
{u:2,q:"Display square and cube",a:"Read an integer and calculate n² and n³.",c:`int n = int.Parse(txtNumber.Text);\nlblResult.Text = $"Square = {n*n}, Cube = {n*n*n}";`},

{u:3,q:"Connect to SQL Server using ADO.NET",a:"Add the System.Data.SqlClient namespace for classic .NET Framework projects. Replace the server and database values with your lab settings.",c:`using System.Data.SqlClient;\nstring cs = @"Data Source=YOUR_SERVER;Initial Catalog=CollegeDB;Integrated Security=True";\nusing (SqlConnection con = new SqlConnection(cs))\n{\n    con.Open();\n    MessageBox.Show("Database connected");\n}`},
{u:3,q:"Insert student record",a:"Use a parameterized INSERT command; never concatenate user input into SQL.",c:`string sql = "INSERT INTO Students(Name, Course, Marks) VALUES(@name,@course,@marks)";\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand(sql, con))\n{\n    cmd.Parameters.AddWithValue("@name", txtName.Text);\n    cmd.Parameters.AddWithValue("@course", cmbCourse.Text);\n    cmd.Parameters.AddWithValue("@marks", decimal.Parse(txtMarks.Text));\n    con.Open(); cmd.ExecuteNonQuery();\n}`},
{u:3,q:"Retrieve all students using SqlDataReader",a:"ExecuteReader returns a forward-only reader. Keep the connection open while reading.",c:`using (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("SELECT StudentID, Name, Course, Marks FROM Students", con))\n{\n    con.Open();\n    using (SqlDataReader r = cmd.ExecuteReader())\n        while (r.Read()) Console.WriteLine($"{r["StudentID"]}: {r["Name"]} - {r["Marks"]}");\n}`},
{u:3,q:"Update student marks",a:"Use an UPDATE query with parameters for the new marks and student ID.",c:`string sql = "UPDATE Students SET Marks=@marks WHERE StudentID=@id";\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand(sql, con))\n{\n    cmd.Parameters.AddWithValue("@marks", decimal.Parse(txtMarks.Text));\n    cmd.Parameters.AddWithValue("@id", int.Parse(txtId.Text));\n    con.Open(); int rows = cmd.ExecuteNonQuery();\n    MessageBox.Show(rows > 0 ? "Updated" : "Student not found");\n}`},
{u:3,q:"Delete student by ID",a:"Execute a parameterized DELETE command and check affected rows.",c:`string sql = "DELETE FROM Students WHERE StudentID=@id";\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand(sql, con))\n{\n    cmd.Parameters.AddWithValue("@id", int.Parse(txtId.Text));\n    con.Open(); int rows = cmd.ExecuteNonQuery();\n    MessageBox.Show(rows > 0 ? "Deleted" : "Student not found");\n}`},
{u:3,q:"Search student by ID",a:"Use a SELECT query with a parameter and handle the case where no row matches.",c:`string sql = "SELECT Name, Course, Marks FROM Students WHERE StudentID=@id";\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand(sql, con))\n{\n    cmd.Parameters.AddWithValue("@id", int.Parse(txtId.Text)); con.Open();\n    using (SqlDataReader r = cmd.ExecuteReader())\n        if (r.Read()) lblResult.Text = $"{r["Name"]} - {r["Course"]} - {r["Marks"]}";\n        else lblResult.Text = "Student not found";\n}`},
{u:3,q:"Count student records with ExecuteScalar",a:"ExecuteScalar returns the first column of the first row.",c:`using (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("SELECT COUNT(*) FROM Students", con))\n{\n    con.Open(); int count = (int)cmd.ExecuteScalar();\n    Console.WriteLine("Students: " + count);\n}`},
{u:3,q:"Demonstrate ExecuteNonQuery",a:"Use ExecuteNonQuery for INSERT, UPDATE and DELETE commands; it returns the number of affected rows.",c:`using (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("UPDATE Students SET Marks=80 WHERE StudentID=1", con))\n{\n    con.Open(); int affected = cmd.ExecuteNonQuery();\n    Console.WriteLine("Rows affected: " + affected);\n}`},
{u:3,q:"Retrieve data using SqlDataAdapter and DataSet",a:"DataAdapter fills a disconnected DataSet that can be read after the connection is closed.",c:`DataSet ds = new DataSet();\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students", con))\n    da.Fill(ds, "Students");\ndataGridView1.DataSource = ds.Tables["Students"];`},
{u:3,q:"Display students in DataGridView",a:"Fill a DataTable with a DataAdapter and bind it to the grid.",c:`DataTable table = new DataTable();\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students", con))\n    da.Fill(table);\ndataGridView1.DataSource = table;`},
{u:3,q:"Student registration form saves to database",a:"Create input controls for Name, Course and Marks, then run the parameterized INSERT command shown in the Insert student record answer.",c:`// In the Save button event:\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("INSERT INTO Students(Name,Course,Marks) VALUES(@n,@c,@m)", con))\n{\n    cmd.Parameters.AddWithValue("@n", txtName.Text.Trim());\n    cmd.Parameters.AddWithValue("@c", cmbCourse.Text);\n    cmd.Parameters.AddWithValue("@m", decimal.Parse(txtMarks.Text));\n    con.Open(); cmd.ExecuteNonQuery();\n    MessageBox.Show("Student saved");\n}`},
{u:3,q:"Student management system: Add, Update, Delete and View",a:"Create four buttons and call parameterized INSERT, UPDATE and DELETE commands. Use SELECT with a DataAdapter to refresh the grid after each operation.",c:`private void LoadStudents()\n{\n    DataTable dt = new DataTable();\n    using (SqlConnection con = new SqlConnection(cs))\n    using (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students", con)) da.Fill(dt);\n    dataGridView1.DataSource = dt;\n}\n// Use the Insert/Update/Delete examples above in their respective button events.`},
{u:3,q:"Display students with marks greater than 75",a:"Use a WHERE clause and bind the results to a DataGridView.",c:`DataTable dt = new DataTable();\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students WHERE Marks > @m", con))\n{\n    da.SelectCommand.Parameters.AddWithValue("@m", 75);\n    da.Fill(dt);\n}\ndataGridView1.DataSource = dt;`},
{u:3,q:"Parameterized SQL query",a:"Parameters separate data from SQL commands and help prevent SQL injection.",c:`string sql = "SELECT * FROM Students WHERE Course=@course";\nusing (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand(sql, con))\n{\n    cmd.Parameters.AddWithValue("@course", cmbCourse.Text);\n    con.Open(); using (SqlDataReader r = cmd.ExecuteReader())\n        while (r.Read()) Console.WriteLine(r["Name"]);\n}`},
{u:3,q:"Connected model using DataReader",a:"A DataReader reads rows while the database connection remains open.",c:`using (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("SELECT Name FROM Students", con))\n{\n    con.Open(); using (SqlDataReader r = cmd.ExecuteReader())\n        while (r.Read()) Console.WriteLine(r["Name"]);\n}`},
{u:3,q:"Disconnected model using DataSet",a:"Fill the DataSet using a DataAdapter; the data can then be used without keeping the connection open.",c:`DataSet ds = new DataSet();\nusing (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students", cs))\n    da.Fill(ds, "Students");\nforeach (DataRow row in ds.Tables["Students"].Rows)\n    Console.WriteLine(row["Name"]);`},
{u:3,q:"Search and display student details in Windows Forms",a:"Use a parameterized SELECT query and show the returned values in labels or textboxes.",c:`using (SqlConnection con = new SqlConnection(cs))\nusing (SqlCommand cmd = new SqlCommand("SELECT Name, Course, Marks FROM Students WHERE StudentID=@id", con))\n{\n    cmd.Parameters.AddWithValue("@id", int.Parse(txtId.Text)); con.Open();\n    using (SqlDataReader r = cmd.ExecuteReader())\n        if (r.Read()) { txtName.Text = r["Name"].ToString(); txtCourse.Text = r["Course"].ToString(); txtMarks.Text = r["Marks"].ToString(); }\n        else MessageBox.Show("Not found");\n}`},
{u:3,q:"Update student records from a form",a:"Read the ID and updated values from controls, then execute a parameterized UPDATE command.",c:`// Example SQL command:\nstring sql = "UPDATE Students SET Name=@n, Course=@c, Marks=@m WHERE StudentID=@id";\n// Add @n, @c, @m and @id parameters, open the connection, then call ExecuteNonQuery().`},
{u:3,q:"DataGridView with DataAdapter",a:"Bind a DataTable to the grid after filling it through a DataAdapter.",c:`DataTable dt = new DataTable();\nusing (SqlDataAdapter da = new SqlDataAdapter("SELECT * FROM Students", cs)) da.Fill(dt);\ndataGridView1.AutoGenerateColumns = true;\ndataGridView1.DataSource = dt;`},
{u:3,q:"Handle database errors",a:"Catch SqlException and display a safe error message; do not expose sensitive connection details.",c:`try\n{\n    using (SqlConnection con = new SqlConnection(cs)) { con.Open(); /* database work */ }\n}\ncatch (SqlException ex)\n{\n    MessageBox.Show("Database operation failed. Check the connection and query.");\n    // Log ex details securely during development.\n}`},

{u:4,q:"Validate email using RegularExpressionValidator",a:"Use a simple email pattern for basic format validation; server-side validation is also recommended.",c:`<asp:TextBox ID="txtEmail" runat="server" />\n<asp:RegularExpressionValidator runat="server" ControlToValidate="txtEmail"\n ValidationExpression="^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$" ErrorMessage="Enter a valid email" />`},
{u:4,q:"CustomValidator example",a:"Use a server-side validation function for a custom rule, such as requiring a number greater than zero.",c:`// .aspx:\n<asp:TextBox ID="txtNumber" runat="server" />\n<asp:CustomValidator ID="cvNumber" runat="server" ControlToValidate="txtNumber"\n OnServerValidate="cvNumber_ServerValidate" ErrorMessage="Enter a positive number" />\n// Code-behind:\nprotected void cvNumber_ServerValidate(object source, ServerValidateEventArgs args)\n{\n    args.IsValid = int.TryParse(args.Value, out int n) && n > 0;\n}`},

const unitNames={0:"All units",1:"Unit I · Windows Forms",2:"Unit II · C# Fundamentals",3:"Unit III · ADO.NET",4:"Unit IV · ASP.NET"};
let active=0, opened=new Set();
const tabs=document.getElementById('tabs'), list=document.getElementById('list'), search=document.getElementById('search'), sort=document.getElementById('sort');
function renderTabs(){tabs.innerHTML='';Object.entries(unitNames).forEach(([id,name])=>{const b=document.createElement('button');b.className='tab'+(active===Number(id)?' active':'');b.textContent=name;b.onclick=()=>{active=Number(id);renderTabs();render()};tabs.appendChild(b)})}
function render(){const term=search.value.toLowerCase().trim();let items=questions.map((x,i)=>({...x,i})).filter(x=>(active===0||x.u===active)&&(!term||(x.q+' '+x.a+' '+x.c+' '+unitNames[x.u]).toLowerCase().includes(term)));if(sort.value==='az')items.sort((a,b)=>a.q.localeCompare(b.q));document.getElementById('stats').textContent=`Showing ${items.length} practical questions · ${questions.length} total`;if(!items.length){list.innerHTML='<div class="empty">No questions found. Try another search term.</div>';return}list.innerHTML='';items.forEach((x,n)=>{const card=document.createElement('section');card.className='card';const head=document.createElement('div');head.className='qhead';head.innerHTML=`<span class="num">${n+1}</span><span class="qtitle">${escapeHtml(x.q)}</span><span class="chev">${opened.has(x.i)?'−':'+'}</span>`;head.onclick=()=>{opened.has(x.i)?opened.delete(x.i):opened.add(x.i);render()};card.appendChild(head);if(opened.has(x.i)){const body=document.createElement('div');body.className='answer';body.innerHTML=`<span class="tag">${escapeHtml(unitNames[x.u])}</span><p>${escapeHtml(x.a)}</p><pre><code>${escapeHtml(x.c)}</code></pre><button class="primary copy">Copy code</button>`;body.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(x.c);body.querySelector('.copy').textContent='Copied!'}catch(e){body.querySelector('.copy').textContent='Select code to copy'}};card.appendChild(body)}list.appendChild(card)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
search.addEventListener('input',render);sort.addEventListener('change',render);renderTabs();render();
</script>
